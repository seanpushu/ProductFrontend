AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ProductFrontend static hosting: private S3 bucket + CloudFront (OAC, HTTPS)
  and the GitHub Actions OIDC role that may only sync this bucket and
  invalidate this distribution. Deployed once by an admin.

Parameters:
  GitHubRepo:
    Type: String
    Default: seanpushu/ProductFrontend
  GitHubRepoImmutable:
    Type: String
    Default: seanpushu@124030213/ProductFrontend@1391457271
    Description: owner@ownerId/repo@repoId, from GET /repos/{repo}/actions/oidc/customization/sub
  GitHubOidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider for token.actions.githubusercontent.com
  AuthOriginDomain:
    Type: String
    Default: ''
    Description: HTTPS host of the User Service (e.g. api.shupu.me). Empty = no auth routes.

Conditions:
  HasAuthOrigin: !Not [!Equals [!Ref AuthOriginDomain, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'productfrontend-site-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags: [{Key: project, Value: productfrontend}]

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}

  # Zero-TTL cache policy for the auth API: every request goes to the origin and
  # nothing (including /me or Set-Cookie responses) is shared between users.
  AuthNoCache:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasAuthOrigin
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-auth-no-cache'
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: {HeaderBehavior: none}
          CookiesConfig: {CookieBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ProductFrontend catalog
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          # Auth API on the same site as the page, so the refresh cookie is first-party.
          - !If
            - HasAuthOrigin
            - Id: auth-api
              DomainName: !Ref AuthOriginDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # AWS managed "CachingOptimized"; per-object Cache-Control from the deploy decides HTML vs assets.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # Auth endpoints: never cached (all TTLs 0), all methods, viewer headers /
        # cookies / query forwarded (AllViewerExceptHostHeader so the origin sees
        # api.shupu.me, matching its certificate).
        CacheBehaviors: !If
          - HasAuthOrigin
          - - {PathPattern: /register, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /confirm*, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /login, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /refresh, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /logout, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /me, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
            - {PathPattern: /auth/*, TargetOriginId: auth-api, ViewerProtocolPolicy: https-only, AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE], CachePolicyId: !Ref AuthNoCache, OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac, Compress: true}
          - !Ref AWS::NoValue
        # No CustomErrorResponses: the catalog has no client-side routes, and a
        # global 403/404 -> index.html rule would turn API auth errors into a 200 page.

  # Only this distribution may read the bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # GitHub Actions (main branch of this repo only): sync this bucket, invalidate this distribution.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: productfrontend-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub immutable subject (owner/repo IDs survive renames) and the legacy name form.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepoImmutable}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  BucketName: {Value: !Ref SiteBucket}
  DistributionId: {Value: !Ref Distribution}
  SiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  GitHubDeployRoleArn: {Value: !GetAtt GitHubDeployRole.Arn}
